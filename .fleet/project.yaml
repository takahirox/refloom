schema_version: 2
commands:
  test:
    argv: ["node", "--test"]
    cwd: "."
  check:
    argv: ["node", "scripts/check.mjs"]
    cwd: "."
rules: []
paths:
  writable: ["src/**", "test/**", "scripts/**", "docs/**", "public/**", "migrations/**", "README.md", "server.mjs", "mcp-server.mjs", "package.json", "package-lock.json", "compose.yaml", "Dockerfile", "LICENSE", ".gitignore"]
  protected: [".git/**", ".fleet/**", ".env*", ".github/workflows/**"]
  generated: ["coverage/**", "tmp/**", "data/**"]
verification:
  required: ["test", "check"]
  evidence_freshness: "exact_diff"
  review:
    required: true
    block_severities: ["critical", "high"]
network:
  mode: "restricted"
  https_domains: ["registry.npmjs.org"]
  ports: [443]
install:
  ecosystems: ["node_project"]
  existing_lock: "allow"
  new_dependency: "approval"
  manifest_lock_mutation: "approval"
  lifecycle_scripts: "deny"
  new_registry_domain: "deny"
  host_global: "deny"
approvals:
  process_shell: "required"
  new_dependency: "required"
  manifest_lock_mutation: "required"
  lifecycle_scripts: "deny"
  new_registry_domain: "deny"
  promotion: "required"
worker:
  preferred: "codex_cli"
  allowed: ["codex_cli"]
  allowed_strategy_ids: ["codex-sol-high"]
  adaptive_routing: true
  local_backend: false
budgets:
  wall_seconds: 1800.0
  worker_turns: 12
  processes: 40
  download_bytes: 50000000
  artifact_bytes: 100000000
