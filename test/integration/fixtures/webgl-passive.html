<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Deterministic passive WebGL fixture</title>
  <style>
    html, body { margin: 0; background: #080b16; }
    canvas { display: block; width: 640px; height: 480px; }
  </style>
</head>
<body>
  <canvas id="scene" width="640" height="480"></canvas>
  <script>
    const canvas = document.querySelector('#scene');
    const gl = canvas.getContext('webgl2') || canvas.getContext('webgl');
    const vertex = gl.createShader(gl.VERTEX_SHADER);
    gl.shaderSource(vertex, 'attribute vec2 p; void main(){gl_Position=vec4(p,0.,1.);}');
    gl.compileShader(vertex);
    const fragment = gl.createShader(gl.FRAGMENT_SHADER);
    gl.shaderSource(fragment, 'precision mediump float; uniform float phase; void main(){gl_FragColor=vec4(phase,0.25,1.0-phase,1.0);}');
    gl.compileShader(fragment);
    const program = gl.createProgram();
    gl.attachShader(program, vertex);
    gl.attachShader(program, fragment);
    gl.linkProgram(program);
    gl.useProgram(program);
    const points = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, points);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,3,-1,-1,3]), gl.STATIC_DRAW);
    const position = gl.getAttribLocation(program, 'p');
    gl.enableVertexAttribArray(position);
    gl.vertexAttribPointer(position, 2, gl.FLOAT, false, 0, 0);
    const phase = gl.getUniformLocation(program, 'phase');
    let frame = 0;
    function render() {
      gl.uniform1f(phase, (frame++ % 12) / 11);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
      if (frame < 24) setTimeout(render, 100);
    }
    render();
  </script>
</body>
</html>
